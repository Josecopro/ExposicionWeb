name: Website CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name:  Validate HTML structure
        run: npx --yes html-validate@8 index.html

      - name: Check formatting
        run: npx --yes prettier@3 --check index.html styles.css README.md